      <path d="M 14.0 1.5 L 826.0 1.5 A 12.5 12.5 0 0 1 838.5 14.0 L 838.5 50.0 A 12.5 12.5 0 0 1 826.0 62.5 L 14.0 62.5 A 12.5 12.5 0 0 1 1.5 50.0 L 1.5 14.0 A 12.5 12.5 0 0 1 14.0 1.5 Z" fill="none" stroke="#6d28d9" stroke-width="5" stroke-linecap="round"
