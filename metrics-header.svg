        <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="11s" repeatCount="indefinite"
                 begin="-2s" />
      </path>
    </g>

    <circle r="14" fill="url(#hdr_magma_blob)">
      <animateMotion path="M 14.0 1.5 L 826.0 1.5 A 12.5 12.5 0 0 1 838.5 14.0 L 838.5 50.0 A 12.5 12.5 0 0 1 826.0 62.5 L 14.0 62.5 A 12.5 12.5 0 0 1 1.5 50.0 L 1.5 14.0 A 12.5 12.5 0 0 1 14.0 1.5 Z" dur="40s" repeatCount="indefinite" begin="-8s" />
    </circle>
    <circle r="10" fill="url(#hdr_magma_blob)">
      <animateMotion path="M 14.0 1.5 L 826.0 1.5 A 12.5 12.5 0 0 1 838.5 14.0 L 838.5 50.0 A 12.5 12.5 0 0 1 826.0 62.5 L 14.0 62.5 A 12.5 12.5 0 0 1 1.5 50.0 L 1.5 14.0 A 12.5 12.5 0 0 1 14.0 1.5 Z" dur="63s" repeatCount="indefinite" begin="-24s" />
    </circle>
    

  <g transform="translate(68, 32)">
