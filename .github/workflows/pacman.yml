name: Generate Pac-Man Contribution Graph

on:
  # jalan otomatis tiap 12 jam
  schedule:
    - cron: "0 */12 * * *"
  # tombol "Run workflow" manual di tab Actions
  workflow_dispatch:
  # jalan tiap ada push ke branch main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # bikin SVG animasi Pac-Man dari kotak kontribusi GitHub kamu
      - name: Generate Pac-Man SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      # push hasilnya ke branch "output"
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
