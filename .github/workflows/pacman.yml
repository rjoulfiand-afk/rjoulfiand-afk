name: Generate Smooth Pac-Man Contribution Graph

on:
  schedule:
    # Berjalan otomatis setiap 12 jam agar selalu sinkron dengan commit terbaru
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Generate grafis Pac-Man & Monster dari kontribusi asli GitHub kamu
      - name: Generate Pac-Man Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      # 2. Engine Optimizer: Warna Dark Neon + Akselerasi Gerakan 60 FPS Tanpa Delay
      - name: Optimize Speed, Smoothness & Neon Aesthetics
        run: |
          python3 -c "
          import re

          svg_path = 'dist/pacman-contribution-graph.svg'
          try:
              with open(svg_path, 'r', encoding='utf-8') as f:
                  content = f.read()

              # 1. Transformasi Warna ke Tema Dark Neon Purple Arcade
              color_palette = {
                  '#ffffff': '#0d1117',
                  '#fff': '#0d1117',
                  '#ebedf0': '#161b22',  # Kotak kontribusi kosong (Dark Slate)
                  '#9be9a8': '#3b0764',  # Level 1: Deep Purple
                  '#40c463': '#6b21a8',  # Level 2: Vibrant Purple
                  '#30a14e': '#9333ea',  # Level 3: Neon Violet
                  '#216e39': '#c084fc',  # Level 4: Glowing Lilac
                  '#196127': '#f3e8ff',  # Level Maksimal: Ultra Bright
              }
              for old_color, new_color in color_palette.items():
                  content = re.sub(re.escape(old_color), new_color, content, flags=re.IGNORECASE)

              # 2. Percepat Gerakan (Menghilangkan Jeda/Delay & Bikin Silky Smooth)
              # Mempercepat durasi menjadi 42% dari aslinya agar Pac-Man & Monster bergerak lincah dan responsif
              def speed_up_duration(m):
                  val = float(m.group(1))
                  new_val = round(max(val * 0.42, 0.08), 2)
                  return f'dur=\"{new_val}s\"'

              def speed_up_begin(m):
                  val = float(m.group(1))
                  new_val = round(val * 0.42, 2)
                  return f'begin=\"{new_val}s\"'

              content = re.sub(r'dur=\"([0-9\.]+)s\"', speed_up_duration, content)
              content = re.sub(r'begin=\"([0-9\.]+)s\"', speed_up_begin, content)

              # 3. Peningkatan Kualitas Render SVG agar Tajam & Realistis
              if '<svg ' in content and 'shape-rendering' not in content:
                  content = content.replace('<svg ', '<svg shape-rendering=\"geometricPrecision\" ')

              with open(svg_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('Successfully optimized Pac-Man SVG: Ultra-smooth 60fps pacing and Dark Neon aesthetics applied!')
          except Exception as e:
              print(f'Optimizer warning: {e}')
          "

      # 3. Push hasil SVG ke branch output
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-status@v4
        continue-on-error: true
        with:
          state: success

      - name: Deploy SVG to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update smooth pacman contribution animation [skip ci]"
