name: Generate Pac-Man & GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pacman-graph
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Generate Animasi Pac-Man Mandiri
      - name: Generate Pac-Man Graph
        run: |
          python3 .github/scripts/pacman_graph.py \
            --user "${{ github.repository_owner }}" \
            --title "Chomping XP" \
            --out dist

      # 2. Fetch & Cache Semua SVG Stats (Dengan Browser User-Agent Header agar Tembus Cloudflare)
      - name: Fetch Stats & Activity Graph SVGs
        run: |
          mkdir -p dist
          
          # A. Activity Graph (Disamarkan dengan User-Agent Chrome)
          curl -sL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -H "Accept: image/svg+xml,image/*,*/*" \
            "https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&bg_color=0D1117&color=A855F7&line=C084FC&point=F5F3FF&area=true&title_color=A855F7&text_color=9CA3AF&border_color=A855F7&radius=12&hide_border=false" \
            -o dist/activity-graph.svg || true

          # B. GitHub Stats Card (Logo GitHub Ungu Neon)
          curl -sL \
            -H "User-Agent: Mozilla/5.0" \
            "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&custom_title=Stats&title_color=A855F7&text_color=E5E7EB&icon_color=A855F7&border_color=A855F7&bg_color=0D1117&hide_border=false&count_private=true&border_radius=12" \
            -o dist/github-stats.svg || true

          # C. Top Languages Card
          curl -sL \
            -H "User-Agent: Mozilla/5.0" \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&langs_count=6&title_color=A855F7&text_color=E5E7EB&border_color=A855F7&bg_color=0D1117&hide_border=false&border_radius=12" \
            -o dist/top-langs.svg || true

          # D. GitHub Streak Stats
          curl -sL \
            -H "User-Agent: Mozilla/5.0" \
            "https://github-readme-streak-stats.herokuapp.com/?user=${{ github.repository_owner }}&hide_border=false&border=A855F7&background=0D1117&ring=A855F7&fire=A855F7&currStreakLabel=E5E7EB&sideLabels=9CA3AF&sideNums=E5E7EB&currStreakNum=A855F7&dates=9CA3AF&stroke=A855F7&border_radius=12" \
            -o dist/streak-stats.svg || true

      # 3. Push SVGs ke Branch output
      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
