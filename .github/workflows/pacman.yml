name: Generate Pac-Man & GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pacman-graph
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Jalankan Pac-Man Arcade Asli Milikmu
      - name: Generate Pac-Man Arcade
        run: |
          python3 .github/scripts/pacman_graph.py \
            --user "${{ github.repository_owner }}" \
            --title "Chomping XP" \
            --out dist

      # 2. Jalankan Generator Cyberpunk Developer Metrics (Persis Foto 2)
      - name: Generate Developer Metrics Suite
        run: |
          python3 .github/scripts/metrics_cards.py

      # 3. Push Semua SVGs ke Branch output
      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
