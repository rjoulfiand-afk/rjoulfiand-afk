name: Generate Pac-Man & Cyberpunk Metrics

on:
  schedule:
    - cron: "0 */6 * * *" # Berjalan otomatis tiap 6 jam
  workflow_dispatch:      # Bisa di-trigger manual lewat tombol Run Workflow di GitHub
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Pac-Man Graph
        run: python .github/scripts/pacman_graph.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Cyberpunk Developer Metrics
        run: python .github/scripts/metrics_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
