name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pacman-graph
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Menjalankan Engine Simulator Pac-Man Python yang sudah di-upgrade
      - name: Generate Pac-Man SVG
        env:
          GH_API_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: |
          python3 .github/scripts/pacman_graph.py \
            --user "${{ github.repository_owner }}" \
            --theme purple \
            --title "Chomping XP" \
            --out dist

      # Push langsung menggunakan Native Git (Cepat, Ringan & 100% Anti-Error Token)
      - name: Push SVG to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: deploy cyberpunk pacman contribution graph"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
