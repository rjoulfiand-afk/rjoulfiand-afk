name: Generate Snake Animation

on:
  # Jalan otomatis tiap 12 jam
  schedule:
    - cron: "0 */12 * * *"
  # Tombol manual "Run workflow"
  workflow_dispatch:
  # Jalan tiap ada commit push ke main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Bikin animasi snake dari grafik kontribusi GitHub kamu
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#A855F7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#A855F7

      # Push hasilnya ke branch "output"
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
