        <feMergeNode in="goo" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="langs_glow_filter" x="-20" y="-20" width="445" height="288" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.0" />
    </filter>
  </defs>

